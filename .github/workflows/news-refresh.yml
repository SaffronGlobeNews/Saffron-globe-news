name: Saffron Globe News - hourly refresh

on:
  push:
    paths:
      - "scripts/update-news.mjs"
      - ".github/workflows/news-refresh.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch latest news
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: node scripts/update-news.mjs

      - name: Commit updated feed
        run: |
          git config user.name "Saffron Globe News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/archive data/news-archive-index.json sitemap.xml rss.xml
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: refresh hourly news feed"
            git push
          fi
