<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story | Saffron Globe News</title><meta name="robots" content="index,follow"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><style>.story-wrap{max-width:900px;margin:auto;padding:45px 24px 80px}.story-wrap h1{font:800 54px/1.08 "Playfair Display",serif;margin:12px 0 18px}.story-deck{font-size:19px;line-height:1.7;color:#5d5852}.story-meta{font-size:12px;color:#777;border-top:1px solid #ccc;padding-top:14px;margin-top:22px}.story-img{width:100%;margin:30px 0 8px;display:block}.story-body{font-size:18px;line-height:1.85;color:#1d2a39}.story-body p{margin:0 0 25px}.source-box{margin-top:35px;padding:20px;border:1px solid #d7d0c7;background:#f6f3ed;font-size:13px}.source-box a{font-weight:700}.back{display:inline-block;margin-bottom:25px;color:#b85c38;text-decoration:none;font-weight:700}.clean-nav{max-width:900px;margin:auto;padding:20px 24px}.clean-nav a{color:inherit;text-decoration:none}.clean-nav img{width:230px}@media(max-width:650px){.story-wrap h1{font-size:40px}}</style></head><body><header class="clean-nav"><a href="index.html"><img src="saffron-globe-logo.svg" alt="Saffron Globe News"></a></header><main class="story-wrap"><a class="back" href="index.html">← Back to latest edition</a><div id="story">Loading story…</div></main><script>
(async()=>{const root=document.getElementById("story");const id=new URLSearchParams(location.search).get("auto");try{const r=await fetch("data/news.json",{cache:"no-store"});const d=await r.json();const s=(d.stories||[]).find(x=>x.id===id);if(!s)throw new Error("not found");document.title=s.title+" | Saffron Globe News";root.innerHTML='<label>'+esc((s.category||"NEWS").toUpperCase())+'</label><h1>'+esc(s.title)+'</h1><div class="story-deck">'+esc(s.description)+'</div><div class="story-meta">Saffron Globe News · Independent editorial brief · '+new Date(s.publishedAt).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})+'</div><img class="story-img" src="'+esc(s.image)+'" alt="'+esc(s.title)+'"><div class="story-body"><p>'+esc(s.description)+'</p><p>This Saffron Globe News brief is independently written from publicly available reporting and official information. It is not a reproduction of the linked publisher’s article.</p><p>Our editorial focus is on the verified development, its wider context and what readers should watch next. We avoid copying another publisher’s wording, structure or photography.</p></div><div class="source-box"><strong>Research source</strong><p>The source below is provided so readers can verify the underlying public reporting. Saffron Globe News does not republish the source article or its photograph.</p><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.source||"External source")+' →</a></div>'}catch(e){root.innerHTML="<h1>Story not found</h1><p class='story-deck'>This report is not available in the current SGN edition.</p>"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}})();
</script></body></html>
